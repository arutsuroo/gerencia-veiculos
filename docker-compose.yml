services:
  redis:
    image: redis:alpine
    container_name: gerencia-veiculos-redis
    ports:
      - "6379:6379"
    networks:
      - veiculos-net

  app:
    build: .
    container_name: gerencia-veiculos-api
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    networks:
      - veiculos-net

networks:
  veiculos-net:
    driver: bridge